<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-label="Tatami mat">
  <defs>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f8a5b"/>
      <stop offset="1" stop-color="#2f6b46"/>
    </linearGradient>
  </defs>
  <!-- red safety border -->
  <rect x="0" y="0" width="320" height="170" rx="10" fill="#b91c1c"/>
  <!-- green competition area -->
  <rect x="12" y="12" width="296" height="146" rx="6" fill="url(#mat)"/>
  <!-- tatami tile seams -->
  <g stroke="#1f4a33" stroke-width="2" stroke-opacity="0.7">
    <line x1="86" y1="12" x2="86" y2="158"/>
    <line x1="160" y1="12" x2="160" y2="158"/>
    <line x1="234" y1="12" x2="234" y2="158"/>
    <line x1="12" y1="85" x2="308" y2="85"/>
  </g>
  <!-- centre lines where the fighters start -->
  <g stroke="#f8fafc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85">
    <line x1="132" y1="85" x2="150" y2="85"/>
    <line x1="170" y1="85" x2="188" y2="85"/>
  </g>
  <circle cx="160" cy="85" r="30" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
