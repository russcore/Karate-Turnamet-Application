  </defs>
  <circle cx="60" cy="60" r="57" fill="url(#bg)" stroke="#e11d48" stroke-width="5"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  <!-- stylised fist -->
  <g fill="#f8fafc">
