    <rect x="49" y="37" width="9" height="21" rx="4"/>
    <rect x="60" y="38" width="9" height="20" rx="4"/>
    <rect x="71" y="41" width="9" height="17" rx="4"/>
    <rect x="37" y="54" width="46" height="30" rx="10"/>
    <rect x="30" y="60" width="14" height="15" rx="7"/>
